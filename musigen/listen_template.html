<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>musigen 듣기</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e2e0db;--accent:#0b63c5;--hl:#d9480f;--warn:#8a5a00}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
header h1{font-size:16px;margin:0 6px 0 0}
select,button,input{font:inherit}
button{border:1px solid var(--line);background:#fafafa;border-radius:6px;padding:4px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
label{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
#status{color:var(--muted);min-width:84px;font-variant-numeric:tabular-nums}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 6px}
.card h3{font-size:14px;margin:10px 0 4px}
blockquote{margin:4px 0 8px;padding:4px 10px;border-left:3px solid var(--line);color:var(--muted)}
details summary{cursor:pointer;color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-top:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:normal;white-space:nowrap}
.src{font-size:11px;padding:0 5px;border-radius:8px;white-space:nowrap}
.src.req{background:#e6eefb;color:var(--accent)}
.src.sug{background:#f1efe9;color:var(--muted)}
ul.checks{margin:4px 0;padding-left:18px}
ul.checks li.err{color:#b00020}
ul.checks li.warn{color:var(--warn)}
#score .page{background:#fff;border:1px solid var(--line);border-radius:6px;margin:0 0 12px;padding:4px}
#score svg{width:100%;height:auto;display:block}
#score g.note.playing, #score g.note.playing *{fill:var(--hl)!important;stroke:var(--hl)!important}
#score g.note{cursor:pointer}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>musigen 듣기</h1>
  <select id="pick" aria-label="곡과 버전"></select>
  <button id="play" class="primary" disabled>▶ 재생</button>
  <button id="stop" disabled>■ 처음으로</button>
  <button id="compare" disabled>바뀐 곳 비교</button>
  <label>음색 <select id="timbre"><option value="piano">피아노</option><option value="synth">합성음</option></select></label>
  <button id="downloadAudio" disabled>피아노 WAV 저장</button>
  <a id="permalink" href="#">이 악보 주소</a>
  <span id="status">불러오는 중…</span>
  <label>빠르기 <input id="speed" type="range" min="50" max="150" value="100" step="5"> <span id="speedv">100%</span></label>
  <label><input id="rh" type="checkbox" checked> 오른손</label>
  <label><input id="lh" type="checkbox" checked> 왼손</label>
  <label><input id="follow" type="checkbox" checked> 따라가기</label>
</header>
<main>
  <div class="card" id="about"></div>
  <div id="score"><p class="muted">악보를 그리는 중…</p></div>
</main>
<script src="/*VEROVIO_SRC*/"></script>
<script>
const PIECES = /*PIECES*/;
const PIANO_BANK = /*PIANO_SAMPLES*/;
const pianoBuffers = new Map();
let pianoReady = false;
const FUNCTIONS = {intro:'도입',statement:'제시',development:'발전',contrast:'대조',transition:'연결',return:'재현',coda:'종결'};
const MODE = {major:'장조', minor:'단조'};
const $ = id => document.getElementById(id);
let tk = null, cur = null, notes = [], staffOf = new Map();
let timeMap = [], measureIds = new Map();
let compareQueue = [], compareTimer = 0, compareLabel = "";
let ctx = null, playing = null, raf = 0, lastHl = [], paused = 0;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const given = (d, path) => (d.given || []).some(g => path === g || path.startsWith(g + '.'));
const mark = (d, path) => given(d, path) ? '<span class="src req">요청</span>' : '<span class="src sug">제안</span>';
function ranges(bars){
  const out = []; let s = null;
  bars.forEach((b, i) => { if(s === null) s = b; if(i + 1 === bars.length || bars[i + 1] !== b + 1){ out.push(s === b ? `${s}` : `${s}–${b}`); s = null; } });
  return out.join(', ');
}

function about(p){
  const d = p.design, b = d.basics, imp = d.impression || {}, th = d.theme || {}, c = p.checks, v = p.info;
  const last = d.form[d.form.length - 1].bars[1];
  let h = `<h2>${esc(d.title || p.piece)} <span class="muted">· ${esc(v.version)}</span></h2>`;
  if(d.request) h += `<blockquote>${esc(d.request)}</blockquote>`;
  h += `<div>${esc(b.key)} ${MODE[b.mode] || ''} · ${esc(b.meter)} · 빠르기 ${b.tempo} · ${last}마디(약 ${Math.round(c.stats.seconds)}초) · ${b.grade || 6}급${b.swing ? ' · 스윙(8분음 2:1로 재생)' : ''}</div>`;
  if(imp.arc) h += `<div class="muted">흐름: ${esc(imp.arc)}</div>`;
  if(v.feedback || v.reason || v.parent){
    h += `<h3>이 버전</h3><ul class="checks">`;
    if(v.feedback || v.reason) h += `<li>요청 원문: ${esc(v.feedback || v.reason)}</li>`;
    if(v.interpretation) h += `<li>작곡 해석: ${esc(v.interpretation)}</li>`;
    if(v.parent && v.changed_bars){
      const both = [...new Set([...v.changed_bars.rh, ...v.changed_bars.lh])].sort((a, b) => a - b);
      h += `<li>${esc(v.parent)}에서 바뀐 마디: ${both.length ? ranges(both) : '없음'}</li>`;
    }
    for(const x of v.preserve_broken || []) h += `<li class="warn">보존 약속: ${esc(x)}</li>`;
    h += `</ul>`;
  }
  h += `<details><summary>작곡 설계 보기</summary>`;
  const rows = [];
  for(const [k, n] of [['mood','정서'],['scene','장면'],['arc','변화']]) if(imp[k]) rows.push([n, imp[k], `impression.${k}`]);
  if(th.idea) rows.push(['주제', th.idea, 'theme.idea']);
  for(const [k, m] of Object.entries(th.motifs || {})) rows.push([`동기 ${k}`, m.describe || '', `theme.motifs.${k}`]);
  h += `<div class="tablewrap"><table><tr><th>요소</th><th>내용</th><th>출처</th></tr>` +
    rows.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td><td>${mark(d, r[2])}</td></tr>`).join('') + `</table></div>`;
  h += `<h3>형식</h3><div class="tablewrap"><table><tr><th>구간</th><th>마디</th><th>역할</th><th>계획</th><th>화성</th><th>셈여림</th><th>출처</th></tr>` +
    d.form.map((s, i) => `<tr><td>${esc(s.label)}</td><td>${s.bars[0]}–${s.bars[1]}</td><td>${FUNCTIONS[s.function] || ''}</td><td>${esc(s.plan)}</td><td>${esc(s.harmony)}</td><td>${esc(s.dynamics)}</td><td>${mark(d, 'form.' + i)}</td></tr>`).join('') + `</table></div>`;
  if(d.climax) h += `<div>절정 ${mark(d, 'climax')} ${d.climax.bar}마디. ${esc(d.climax.how)}</div>`;
  if(d.ending) h += `<div>끝맺음 ${mark(d, 'ending')} ${esc(d.ending.how)}</div>`;
  h += `</details><details><summary>자동 검사와 동기 사용</summary><ul class="checks">`;
  if(c.stats.climax) h += `<li>가장 높은 음 ${esc(c.stats.climax.pitch)} (${ranges(c.stats.climax.bars)}마디)</li>`;
  for(const s of c.sections) h += `<li>${esc(s.label)} ${s.bars[0]}–${s.bars[1]}마디(${FUNCTIONS[s.function] || ''}): 동기 ${esc(s.motifs_used.join(', ') || '없음')}, 동기가 나오는 마디 ${s.motif_bars}/${s.bars_total}</li>`;
  for(const e of c.errors) h += `<li class="err">오류: ${esc(e)}</li>`;
  for(const w of c.warnings) h += `<li class="warn">주의: ${esc(w)}</li>`;
  for(const n of c.notes || []) h += `<li>참고: ${esc(n)}</li>`;
  for(const s of c.musical?.sections || []) h += `<li>${esc(s.label)} 오른손: 평균 MIDI ${s.mean_pitch ?? '없음'}, 음역 ${esc(s.range?.join('–') || '없음')}, 마디당 ${s.density.toFixed(2)}음 · 화음 변화 ${s.chord_changes_per_bar.toFixed(2)}회 · ${esc(s.keys.map(k=>k.replace(/Key\(tonic_tpc=(-?\d+), minor=(True|False)\)/g,(_,t,m)=>['C','G','D','A','E','B','F#'][+t] ? ['C','G','D','A','E','B','F#'][+t]+' '+(m==='True'?'단조':'장조') : ({'-1':'F','-2':'Bb','-3':'Eb','-4':'Ab','-5':'Db','-6':'Gb'}[t]||t)+' '+(m==='True'?'단조':'장조'))).join(', '))}</li>`;
  if(c.recognition){
    for(const s of c.recognition.sections) h += `<li>${esc(s.label)} 동기 마디: 출처 ${s.source_bars}, 유사도 기준 ${s.score_bars} (잠정)</li>`;
    h += `<li>동기 음정·리듬 점수는 청취 인식률이 아닙니다.</li>`;
  }
  if(!c.errors.length && !c.warnings.length) h += `<li>자동 검사에서 걸린 것이 없습니다.</li>`;
  h += `</ul></details><div class="muted" style="margin-top:6px">음표를 누르면 그 위치부터 재생합니다. ${PIANO_BANK ? "피아노는 녹음 샘플을 사용하며, 실제 연주자의 표현을 재현한 것은 아닙니다." : "합성음 미리듣기입니다. 피아노 샘플은 이 페이지에 포함하지 않았습니다."}</div>`;
  if(PIANO_BANK) h += `<details><summary>피아노 음원 출처</summary>FluidR3_GM — Frank Wen 및 기여자(© 2000–2002, 2008), MP3 패키징 Benjamin Gleitzman.
    <a href="https://github.com/gleitz/midi-js-soundfonts/tree/044fab8e1456bfafc5776e86dfd6bb8697149aef">원본</a> ·
    <a href="https://creativecommons.org/licenses/by/3.0/us/">CC BY 3.0 US</a>.
    MIDI 21–108에서 3반음마다 선택, JSON/MIME 변환; MP3 바이트 유지. 샘플별 최대 진폭을 맞추고, 근접 음을 최대 1반음 이동하여 음량·음 길이·페달을 적용합니다.
    WAV 저장 시 함께 받는 출처 파일을 보관해 주세요.</details>`;
  $('about').innerHTML = h;
}

function render(){
  const w = $('score').clientWidth || 1000;
  const scale = w < 600 ? 30 : 40;
  tk.setOptions({pageWidth: Math.round((w - 10) * 100 / scale), pageHeight: 60000, scale, breaks: 'auto', adjustPageHeight: true,
    svgViewBox: true, header: 'auto', footer: 'none', pageMarginTop: 30, pageMarginBottom: 30, pageMarginLeft: 30, pageMarginRight: 30});
  tk.redoLayout();
  let html = '';
  for(let p = 1; p <= tk.getPageCount(); p++) html += `<div class="page">${tk.renderToSVG(p)}</div>`;
  $('score').innerHTML = html;
}

function prepare(){
  const mei = new DOMParser().parseFromString(tk.getMEI(), 'application/xml');
  staffOf = new Map();
  for(const st of mei.getElementsByTagName('staff'))
    for(const nt of st.getElementsByTagName('note')) staffOf.set(nt.getAttribute('xml:id'), st.getAttribute('n'));
  measureIds = new Map();
  for(const m of mei.getElementsByTagName('measure')) measureIds.set(+m.getAttribute('n'),m.getAttribute('xml:id'));
  timeMap = tk.renderToTimemap();
  const tieNext = new Map(), tieEnds = new Set();
  for(const t of mei.getElementsByTagName('tie')){
    const a = (t.getAttribute('startid') || '').replace('#', ''), b = (t.getAttribute('endid') || '').replace('#', '');
    if(a && b){ tieNext.set(a, b); tieEnds.add(b); }
  }
  notes = [];
  const swing = !!cur.design.basics.swing;
  for(const e of timeMap){
    for(const id of (e.on || [])){
      if(tieEnds.has(id)) continue;
      const v = tk.getMIDIValuesForElement(id);
      if(!v || !(v.pitch > 0) || !(v.duration > 0)) continue;
      let end = v.time + v.duration, x = id, guard = 0;
      while(tieNext.has(x) && guard++ < 64){ x = tieNext.get(x); const u = tk.getMIDIValuesForElement(x); if(u && u.duration > 0) end = Math.max(end, u.time + u.duration); }
      let t=v.time, d=end-v.time;
      if(swing){
        const frac=((e.qstamp%1)+1)%1;
        const beatStart=Math.floor(e.qstamp), quarter=qMs(beatStart+1)-qMs(beatStart), late=quarter/6;
        if(Math.abs(frac-.5)<1e-3){ t+=late; d=Math.max(quarter/8,d-late); }
        else if(frac<1e-3 && Math.abs(d-quarter/2)<quarter/20) d+=late;
      }
      notes.push({id,t,d,p:v.pitch,lh:staffOf.get(id)==='2',q:e.qstamp,level:1});
    }
  }
  notes.sort((a, b) => a.t - b.t);
  applyPerformance();
}

// Quarter positions are mapped using Verovio, including pickup and tempo changes.
function qMs(q){
  const pts = timeMap.filter(x => Number.isFinite(x.qstamp) && Number.isFinite(x.tstamp));
  if(!pts.length) return 0;
  let a=pts[0], b=pts[pts.length-1];
  for(const p of pts){ if(p.qstamp <= q) a=p; if(p.qstamp >= q){ b=p; break; } }
  if(b.qstamp===a.qstamp) return a.tstamp;
  return a.tstamp + (q-a.qstamp)/(b.qstamp-a.qstamp)*(b.tstamp-a.tstamp);
}
function applyPerformance(){
  const pf = cur.performance || {}, ds=pf.dynamics || [], ex=pf.expression || [];
  const baseAt = q => ds.filter(d=>d.q<=q).at(-1)?.level ?? .8;
  const ladder=[.25,.35,.5,.65,.8,.95,1.1,1.25]; // ROUND1 provisional loudness, not calibrated audio.
  for(const n of notes){
    let level=baseAt(n.q), release=n.t+n.d*.95;
    const hp=ex.find(e=>e.kind==='hairpin' && e.start<=n.q && n.q<e.end);
    if(hp){
      const from=baseAt(hp.start), next=ds.find(d=>d.q>hp.start && d.q<=hp.end);
      const i=ladder.indexOf(from), to=next?.level ?? ladder[Math.max(0,Math.min(ladder.length-1,(i<0?4:i)+(hp.mode==='cresc'?1:-1)))];
      level=from+(to-from)*(n.q-hp.start)/(hp.end-hp.start);
    } else {
      // A completed hairpin keeps its target until a later explicit dynamic.
      const last=ex.filter(e=>e.kind==='hairpin' && e.end<=n.q).sort((a,b)=>a.end-b.end).at(-1);
      if(last && !ds.some(d=>d.q>last.start && d.q<=n.q)){
        const from=baseAt(last.start), i=ladder.indexOf(from);
        level=ladder[Math.max(0,Math.min(ladder.length-1,(i<0?4:i)+(last.mode==='cresc'?1:-1)))];
      }
    }
    const art=(pf.articulations||[]).find(a=>Math.abs(a.q-n.q)<1e-7 && (a.hand==='lh')===n.lh && a.pitches.includes(n.p))?.art;
    if(art==='accent') level*=1.3;
    if(art==='staccato') release=n.t+n.d*.5;
    if(art==='tenuto') release=n.t+n.d;
    // Sustain affects the acoustic release, not notation/highlight. tone() retains its decay.
    for(const ped of ex.filter(e=>e.kind==='pedal')){
      const boundaries=[ped.start,...ped.changes,ped.end];
      for(let i=0;i<boundaries.length-1;i++)
        if(qMs(boundaries[i])<=release && release<qMs(boundaries[i+1])) release=qMs(boundaries[i+1]);
    }
    n.d=Math.max(0,release-n.t); n.level=level;
  }
}

function open(i, comparison = false){
  if(!comparison) cancelComparison();
  stop(); paused = 0;
  cur = PIECES[i];
  about(cur);
  if(!tk.loadData(cur.xml)){ $('score').textContent = '악보를 읽지 못했습니다.'; return; }
  render(); prepare(); colorChanges();
  $('pick').value = String(i);
  $('compare').disabled = !cur.info.joins?.length || !PIECES.some(p=>p.piece===cur.piece && p.info.version===cur.info.parent);
  $('play').disabled = $('timbre').value==='piano' && !pianoReady;
  $('stop').disabled = false;
  $('downloadAudio').disabled = !pianoReady;
  $('status').textContent = `${fmt(0)} / ${fmt(endMs())}`;
  const fragment = `piece=${encodeURIComponent(cur.piece)}&version=${encodeURIComponent(cur.info.version)}`;
  if(!comparison){ try{ history.replaceState(null,'','#'+fragment); }catch{} }
  $('permalink').href = '#'+fragment;
  $('permalink').title = '현재 곡과 버전으로 바로 열리는 주소';
  try{ localStorage.setItem('musigen-listen', `${cur.piece}/${cur.info.version}`); }catch{}
}

const endMs = () => notes.length ? Math.max(...notes.map(n => n.t + n.d)) : 0;
function fmt(ms){ ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

// a plucked-string tone: quick attack, decay that keeps sounding through long notes (closer to a piano than a flat organ tone)
function pianoTone(audio, when, dur, pitch, level){
  const keys=[...pianoBuffers.keys()], key=keys.reduce((a,b)=>Math.abs(b-pitch)<Math.abs(a-pitch)?b:a);
  const src=audio.createBufferSource(), gain=audio.createGain();
  src.buffer=pianoBuffers.get(key); src.playbackRate.value=2**((pitch-key)/12);
  src.connect(gain).connect(audio.destination);
  // The recording supplies the hammer attack and natural decay; no oscillator/loop.
  const end=when+Math.max(.01,dur);
  gain.gain.setValueAtTime(level*6,when);
  gain.gain.setValueAtTime(level*6,end);
  gain.gain.exponentialRampToValueAtTime(.00001,end+.16);
  src.start(when); src.stop(end+.18); return [src];
}
async function preparePiano(){
  if(!PIANO_BANK){ $('timbre').value='synth'; $('timbre').options[0].disabled=true; return; }
  $('status').textContent='피아노 음원 준비 중…';
  try{
    const decoder=new OfflineAudioContext(1,1,44100);
    await Promise.all(Object.entries(PIANO_BANK.notes).map(async([key,url])=>{
      const raw=atob(url.split(',')[1]), bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
      const buffer=await decoder.decodeAudioData(bytes.buffer);
      // One recorded velocity layer: normalize each sample peak for consistent preview level.
      let peak=0;
      for(let c=0;c<buffer.numberOfChannels;c++) for(const x of buffer.getChannelData(c)) peak=Math.max(peak,Math.abs(x));
      if(!peak) throw Error('무음 피아노 샘플: '+key);
      for(let c=0;c<buffer.numberOfChannels;c++){
        const channel=buffer.getChannelData(c); for(let i=0;i<channel.length;i++) channel[i]*=.8/peak;
      }
      pianoBuffers.set(+key,buffer);
    }));
    pianoReady=true;
    $('play').disabled=!cur; $('downloadAudio').disabled=!cur;
    $('status').textContent='피아노 준비됨';
  }catch(e){ $('status').textContent='피아노 음원을 읽지 못했습니다. 합성음을 선택할 수 있습니다.'; console.error(e); }
}
function tone(when, dur, pitch, level){
  if($('timbre').value==='piano') return pianoTone(ctx,when,dur,pitch,level);
  const f = 440 * 2 ** ((pitch - 69) / 12), g = ctx.createGain(), lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = Math.min(9000, f * 6);
  const parts = [[1, 1, 'triangle'], [2, .35, 'sine'], [3, .12, 'sine']].map(([h, a, type]) => {
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = type; o.frequency.value = f * h; og.gain.value = a; o.connect(og).connect(lp); return o;
  });
  lp.connect(g); g.connect(ctx.destination);
  const decay = Math.max(.6, 3.2 - (pitch - 40) * .03), end = when + Math.max(.1, dur);
  g.gain.setValueAtTime(.0001, when);
  g.gain.linearRampToValueAtTime(level, when + .006);
  g.gain.setTargetAtTime(level * .25, when + .01, decay / 3);
  g.gain.setTargetAtTime(.0001, end, .08);
  for(const o of parts){ o.start(when); o.stop(end + .5); }
  return parts;
}

function play(fromMs = 0, untilMs = endMs(), done = null){
  if($('timbre').value==='piano' && !pianoReady) return;
  stop();
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'interactive'});
  ctx.resume();
  const k = 100 / +$('speed').value, t0 = ctx.currentTime + .08, oscs = [];
  const rh = $('rh').checked, lh = $('lh').checked;
  for(const n of notes){
    if(n.t >= untilMs || n.t + n.d <= fromMs || (n.lh ? !lh : !rh)) continue;
    const start = Math.max(0, n.t - fromMs), dur = Math.min(n.t+n.d,untilMs)-Math.max(fromMs,n.t);
    oscs.push(...tone(t0 + start * k / 1000, dur * k / 1000, n.p, (n.lh ? .045 : .085) * n.level));
  }
  playing = {oscs, t0, fromMs, k, untilMs, done};
  $('play').textContent = '❚❚ 일시정지';
  tick();
}
function stop(keep){
  if(playing) for(const o of playing.oscs) try{ o.stop(); }catch{}
  const pos = playing ? nowMs() : 0;
  playing = null; cancelAnimationFrame(raf); highlight([]);
  $('play').textContent = '▶ 재생';
  return keep ? pos : 0;
}
const nowMs = () => playing ? playing.fromMs + (ctx.currentTime - playing.t0) * 1000 / playing.k : 0;
function highlight(ids){
  for(const el of lastHl) el.classList.remove('playing');
  lastHl = [];
  for(const id of ids){ const el = document.getElementById(id); if(el){ el.classList.add('playing'); lastHl.push(el); } }
}
function tick(){
  if(!playing) return;
  const ms = nowMs(), end = playing.untilMs;
  $('status').textContent = `${compareLabel}${fmt(ms)} / ${fmt(end)}`;
  if(ms >= end){ const done=playing.done; stop(); paused = 0; if(done) done(); return; }
  const at = tk.getElementsAtTime(Math.max(0, Math.round(ms)));
  highlight(at && at.notes ? at.notes : []);
  if($('follow').checked && lastHl.length){
    const r = lastHl[0].getBoundingClientRect();
    if(r.top < 70 || r.bottom > window.innerHeight - 40) window.scrollBy({top: r.top - window.innerHeight / 3, behavior: 'smooth'});
  }
  raf = requestAnimationFrame(tick);
}

function colorChanges(){
  const changed=new Set([...(cur.info.changed_bars?.rh||[]),...(cur.info.changed_bars?.lh||[])]);
  for(const bar of changed){
    const el=document.getElementById(measureIds.get(bar)); if(!el) continue;
    const boxes=[...el.querySelectorAll('g.staff')].map(s=>s.getBBox());
    const all=el.getBBox();
    const y=boxes.length?Math.min(...boxes.map(b=>b.y)):all.y;
    const end=boxes.length?Math.max(...boxes.map(b=>b.y+b.height)):all.y+all.height;
    const b={x:all.x,y,width:all.width,height:end-y}, rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',b.x); rect.setAttribute('y',b.y); rect.setAttribute('width',b.width); rect.setAttribute('height',b.height);
    rect.setAttribute('fill','#ffe6a1'); rect.setAttribute('opacity','.45'); rect.setAttribute('class','changed-bar');
    el.prepend(rect);
  }
}
function cancelComparison(){ clearTimeout(compareTimer); compareQueue=[]; compareLabel=''; }
function runComparison(){
  const item=compareQueue.shift();
  if(!item){ compareLabel=''; return; }
  open(item.index,true);
  compareLabel=`${cur.info.version} ${item.a}–${item.z}마디 · `;
  const bars=cur.performance.bars.filter(b=>item.a<=b.bar && b.bar<=item.z);
  if(!bars.length){ runComparison(); return; }
  play(qMs(bars[0].start),qMs(bars.at(-1).end),()=>{
    compareTimer=setTimeout(runComparison,item.gap);
  });
}
$('compare').addEventListener('click',()=>{
  if($('timbre').value==='piano' && !pianoReady) return;
  cancelComparison(); stop();
  const current=PIECES.indexOf(cur), parent=PIECES.findIndex(p=>p.piece===cur.piece && p.info.version===cur.info.parent);
  if(parent<0) return;
  for(const j of cur.info.joins||[]){
    const a=j.before ?? j.changed[0], z=j.after ?? j.changed[1];
    compareQueue.push({index:parent,a,z,gap:0},{index:current,a,z,gap:1000});
  }
  runComparison();
});
$('timbre').addEventListener('change',()=>{
  const at=playing?nowMs():null; cancelComparison(); stop();
  $('play').disabled=$('timbre').value==='piano'&&!pianoReady;
  if(at!==null && !$('play').disabled) play(at);
});
function download(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function wavBlob(buffer){
  const pcm=buffer.getChannelData(0), bytes=new ArrayBuffer(44+pcm.length*2), v=new DataView(bytes);
  const str=(at,s)=>[...s].forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));
  str(0,'RIFF'); v.setUint32(4,36+pcm.length*2,true); str(8,'WAVE'); str(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,buffer.sampleRate,true); v.setUint32(28,buffer.sampleRate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40,pcm.length*2,true);
  let peak=0; for(const x of pcm) peak=Math.max(peak,Math.abs(x));
  const scale=peak>.98?.98/peak:1;
  for(let i=0;i<pcm.length;i++) v.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,pcm[i]*scale))*32767),true);
  return new Blob([bytes],{type:'audio/wav'});
}
$('downloadAudio').addEventListener('click',async()=>{
  if(!pianoReady) return;
  const button=$('downloadAudio'); button.disabled=true; button.textContent='음원 만드는 중…';
  const selected=cur, seq=notes.slice(), k=100/+$('speed').value, rh=$('rh').checked, lh=$('lh').checked;
  try{
    const audio=new OfflineAudioContext(1,Math.ceil((endMs()*k/1000+.5)*44100),44100);
    for(const n of seq) if(n.lh?lh:rh) pianoTone(audio,n.t*k/1000,n.d*k/1000,n.p,(n.lh?.045:.085)*n.level);
    const rendered=await audio.startRendering();
    const base=`${selected.piece}-${selected.info.version}-piano`;
    download(wavBlob(rendered),base+'.wav');
    const notice=`${selected.design.title} · ${selected.info.version}\n피아노: FluidR3_GM — Frank Wen 및 기여자 (© 2000–2002, 2008). MP3 패키징 Benjamin Gleitzman.\nCC BY 3.0 US https://creativecommons.org/licenses/by/3.0/us/\n원본 https://github.com/gleitz/midi-js-soundfonts/tree/044fab8e1456bfafc5776e86dfd6bb8697149aef\n3반음 간격 샘플을 선택해 JSON으로 변환, MP3 유지. 샘플별 최대 진폭 정규화, 근접 음 이동·음량·길이·페달을 적용한 렌더링.\n이 샘플 출처는 악보 자체의 권리와 별개입니다.\n`;
    download(new Blob([notice],{type:'text/plain;charset=utf-8'}),base+'-출처.txt');
  }catch(e){ $('status').textContent='음원 저장 실패: '+e.message; }
  finally{ button.disabled=false; button.textContent='피아노 WAV 저장'; }
});
window.addEventListener('hashchange',()=>{
  const q=new URLSearchParams(location.hash.slice(1));
  const i=PIECES.findIndex(p=>p.piece===q.get('piece')&&(!q.get('version')||p.info.version===q.get('version')));
  if(i>=0) open(i);
});
$('play').addEventListener('click', () => { cancelComparison(); if(playing) paused = stop(true); else { play(paused); paused = 0; } });
$('stop').addEventListener('click', () => { cancelComparison(); paused = 0; stop(); $('status').textContent = `${fmt(0)} / ${fmt(endMs())}`; });
$('speed').addEventListener('input', () => { $('speedv').textContent = $('speed').value + '%'; if(playing){ const p=nowMs(); cancelComparison(); play(p); } });
for(const id of ['rh', 'lh']) $(id).addEventListener('change', () => { if(playing){ const p=nowMs(); cancelComparison(); play(p); } });
$('pick').addEventListener('change', () => open(+$('pick').value));
$('score').addEventListener('click', e => {
  const g = e.target.closest('g.note'); if(!g || !tk) return;
  const v = tk.getMIDIValuesForElement(g.id); if(v && v.time >= 0){ cancelComparison(); paused = 0; play(v.time); }
});
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if(cur){ const p = playing ? nowMs() : null; cancelComparison(); stop(); render(); prepare(); colorChanges(); if(p != null) play(p); } }, 300); });

$('pick').innerHTML = PIECES.map((p, i) => `<option value="${i}">${esc(p.design.title || p.piece)} · ${esc(p.info.version)}${p.info.reason ? ' · ' + esc(p.info.reason) : ''}</option>`).join('');
verovio.module.onRuntimeInitialized = () => {
  tk = new verovio.toolkit();
  let last = null; try{ last = localStorage.getItem('musigen-listen'); }catch{}
  const q=new URLSearchParams(location.hash.slice(1));
  const linked=PIECES.findIndex(p=>p.piece===q.get('piece') && (!q.get('version')||p.info.version===q.get('version')));
  const i = linked>=0?linked:Math.max(0, PIECES.findIndex(p => `${p.piece}/${p.info.version}` === last));
  $('pick').value = String(i);
  $('timbre').value=PIANO_BANK?'piano':'synth';
  open(i); preparePiano();
};
</script>
